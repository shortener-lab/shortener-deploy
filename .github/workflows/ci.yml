name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: terraform fmt
        run: terraform fmt -check -recursive infra
      - name: terraform validate
        run: |
          for dir in infra/organization infra/bootstrap/shared infra/bootstrap/staging infra/bootstrap/prod \
                     infra/envs/*/aws infra/envs/*/platform; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Instala kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform
          kubeconform -v
      - name: Valida manifests (kustomize + kubeconform com CRDs do Argo Rollouts)
        shell: bash
        run: |
          set -euo pipefail
          CRDS='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for app in api web; do
            for env in staging prod; do
              echo "::group::$app/$env"
              kubectl kustomize "apps/$app/overlays/$env" \
                | kubeconform -strict -summary -schema-location default -schema-location "$CRDS" -
              echo "::endgroup::"
            done
          done
