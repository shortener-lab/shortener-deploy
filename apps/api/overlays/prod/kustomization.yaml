apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shortener
resources:
  - ../../base
images:
  - name: shortener-api
    newName: ghcr.io/shortener-lab/shortener-api
    newTag: sha-17d93d0 # só muda pelo workflow "Promote" (Fase 8)
configMapGenerator:
  - name: shortener-api-config
    literals:
      - PUBLIC_BASE_URL=https://shortener.fabricioroglio.com
      - CORS_ALLOWED_ORIGINS=https://app.shortener.fabricioroglio.com
      - LOG_LEVEL=info
      - CACHE_TTL_SECONDS=86400
      - RATE_LIMIT_PER_MINUTE=10
replicas:
  - name: worker
    count: 2
patches:
  - target: {kind: Ingress, name: api}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: shortener.fabricioroglio.com
      - op: replace
        path: /spec/rules/1/host
        value: api.shortener.fabricioroglio.com
      - op: add
        path: /metadata/annotations/alb.ingress.kubernetes.io~1certificate-arn
        value: arn:aws:acm:us-east-1:849110176337:certificate/d9c977e1-70f9-4d28-b31a-6d7bc18039ca
